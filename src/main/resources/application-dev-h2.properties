# SpecRadar API - Perfil DEV-H2 (opcional)
#
# H2 em memória, disponível como alternativa ao perfil "dev" (Oracle FIAP)
# para quem não tem acesso ao schema RM558540 (ex.: outro integrante do
# grupo testando localmente). Ativar com:
#   SPRING_PROFILES_ACTIVE=dev-h2
# como variável de ambiente real (SO ou run configuration da IDE) — nunca
# via .env, pelo mesmo motivo documentado para o perfil prod (ver
# docs/README-provisorio-do-que-foi-feito.md, seção "Como rodar").
#
# Decisão de timing (Fase C): o perfil "dev" padrão continua apontando
# para o Oracle FIAP por enquanto — ainda em desenvolvimento ativo, e toda
# a rotina de teste manual depende dele. Este perfil "dev-h2" é uma opção
# ADICIONAL, não uma substituição. A virada de verdade (dev = H2, como no
# Código 1) fica planejada para o fim do projeto, quando o código estiver
# mais estável.
#
# Banco fica vazio a cada reinício (in-memory) — as 9 migrations Flyway
# (já portáveis desde a Fase C: IDENTITY em vez de sequence manual) rodam
# do zero toda vez, recriando inclusive os usuários seed da V5.

# Banco H2 em memória — DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a
# aplicação estiver de pé (sem isso, o H2 destruiria os dados assim que o
# pool de conexões fechasse a última conexão ociosa).
spring.datasource.url=jdbc:h2:mem:specradar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Pool de conexoes (mesmo tamanho do perfil dev)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Dialeto e schema — sobrescrevem os valores Oracle-específicos do
# application.properties base (OracleDialect / RM558540). PUBLIC é o
# schema padrão do H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=PUBLIC

# JPA verboso, igual ao perfil dev
spring.jpa.show-sql=true

# Flyway — permite clean (banco descartável, igual ao perfil dev).
# repair-on-migrate NÃO é copiado do perfil dev aqui de propósito: ele
# existe pra corrigir checksum divergente entre o histórico gravado
# (flyway_schema_history_llm) e a migration atual — mas o H2 in-memory
# nasce vazio a cada boot, então nunca existe histórico de um boot
# anterior pra divergir. A flag seria sempre um no-op neste perfil.
spring.flyway.clean-disabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging detalhado, igual ao perfil dev
logging.level.com.icers.ford=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger habilitado, igual ao perfil dev
springdoc.swagger-ui.enabled=true

# SSL desabilitado — HTTP local, igual ao perfil dev
server.ssl.enabled=false
