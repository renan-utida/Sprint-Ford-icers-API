# SpecRadar API - Perfil PROD
# Todas as credenciais via variaveis de ambiente
# NUNCA commitar valores reais neste arquivo

# Banco Oracle
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexoes maior em prod
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA sem mostrar SQL em prod
spring.jpa.show-sql=false

# Flyway conservador em prod
spring.flyway.clean-disabled=true

# Logging minimo em prod
logging.level.com.icers.ford=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Swagger desabilitado em prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false