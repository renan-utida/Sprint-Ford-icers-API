# SPECRADAR API - Perfil DEV

# Banco Oracle FIAP (desenvolvimento)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexões
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA mais verboso em dev para debug
spring.jpa.show-sql=true

# Flyway em dev
spring.flyway.clean-disabled=false

# Logging mais detalhado em dev
logging.level.com.icers.ford=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger habilitado em dev
springdoc.swagger-ui.enabled=true