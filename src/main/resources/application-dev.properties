# SpecRadar API - Perfil DEV
#
# H2 em memória — nenhum acesso ao Oracle da FIAP necessário para
# desenvolver localmente. Banco fica vazio a cada reinício; as 9
# migrations Flyway (escritas em sintaxe portável desde a Fase C: IDENTITY
# em vez de sequence manual) rodam do zero toda vez, recriando inclusive
# os usuários seed da V5.

# Banco H2 em memória — DB_CLOSE_DELAY=-1 mantém o banco vivo enquanto a
# aplicação estiver de pé (sem isso, o H2 destruiria os dados assim que o
# pool de conexões fechasse a última conexão ociosa).
spring.datasource.url=jdbc:h2:mem:specradar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Pool de conexoes
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Dialeto e schema — sobrescrevem os valores Oracle-específicos do
# application.properties base (OracleDialect / RM558540). PUBLIC é o
# schema padrão do H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=PUBLIC

# JPA verboso em dev
spring.jpa.show-sql=true

# Flyway em dev — permite clean (banco descartável). repair-on-migrate não
# é necessário aqui: o H2 in-memory nasce vazio a cada boot, então nunca
# existe histórico de um boot anterior pra divergir de checksum.
spring.flyway.clean-disabled=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging detalhado em dev
logging.level.com.icers.ford=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Swagger habilitado em dev
springdoc.swagger-ui.enabled=true

# SSL desabilitado em dev - HTTP local
server.ssl.enabled=false
