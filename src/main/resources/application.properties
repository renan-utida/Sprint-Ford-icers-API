# SpecRadar API - Configuracao Base
# Projeto: sprint-ford-api | ICERS | Ford FIAP 2026

spring.application.name=sprint-ford-api

# Perfil ativo
spring.profiles.active=${SPRING_PROFILE:dev}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.default_schema=RM558540
spring.jpa.open-in-view=false

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_llm
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=true

# SERVIDOR
server.port=${SERVER_PORT:8080}

# Nunca expor stack trace ao cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.access=28800000
jwt.expiration.refresh=604800000

# LLM
llm.api.key=${LLM_API_KEY}
llm.api.url=${LLM_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
llm.api.model=${LLM_MODEL:gemini-3.7-flash}
llm.api.timeout.seconds=60

# RATE LIMITING - dois mecanismos independentes, com configs separadas
# (antes compartilhavam a mesma chave, o que os tornava efetivamente
# um único limite, não dois).
ratelimit.ip.requests-per-minute=60
ratelimit.user.requests-per-minute=60

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-order=ASC
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1

# LOGGING BASE
logging.level.com.icers.ford=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN