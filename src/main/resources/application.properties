# SPECRADAR API - Configuração Base
# Projeto: sprint-ford-api - ICERS - Ford FIAP 2026

spring.application.name=sprint-ford-api

# Perfil ativo - sobrescrito por variável de ambiente em produção
spring.profiles.active=${SPRING_PROFILE:dev}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# SERVIDOR
server.port=${SERVER_PORT:8080}

# Nunca expor stack trace ao cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.access=28800000
jwt.expiration.refresh=604800000

# LLM
llm.api.key=${LLM_API_KEY}
llm.api.url=${LLM_API_URL:https://api.anthropic.com/v1/messages}
llm.api.model=${LLM_MODEL:claude-opus-4-5}
llm.api.timeout.seconds=30

# RATE LIMITING
ratelimit.requests-per-minute=60

# SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# LOGGING BASE
logging.level.com.icers.ford=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN